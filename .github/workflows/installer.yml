name: windows installer

# Builds UgandaBusinessWatch-Setup-<version>.exe.
#  - Run it by hand (Actions > windows installer > Run workflow) to get the installer as a
#    downloadable artifact.
#  - Push a tag such as v1.2.0 to also publish it as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # only used to publish the release for a version tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python -m pytest -q
      - name: Make sure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Python python
      - uses: actions/upload-artifact@v7
        with:
          name: UgandaBusinessWatch-Setup
          path: dist/installer/*.exe
          if-no-files-found: error
      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/installer/*.exe --title "Uganda Business Watch ${{ github.ref_name }}" --generate-notes
